<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Run tracker template (run-tracker skill). Every visible value comes from db doc status/now; hand-fix ticks live in collection "fixes".
   Layout: status bar, hero (title, totals, readiness meter), activity log | sheets + hand fixes. Single dark console look by choice. */
:root{
  --bg:#07090b; --panel:#0d1115; --panel2:#11171c; --line:#1d262e; --fg:#d7dee4; --muted:#6f7d89;
  --ok:#3ddc84; --warn:#f5b83d; --hot:#ff4d4d; --info:#4fb3ff;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace; --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:13px;line-height:1.45}
.wrap{max-width:1000px;margin:0 auto;padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px}
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;padding:8px 12px;border:1px solid var(--line);background:var(--panel);border-radius:6px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.bar .l{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-weight:700}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
.live.off{color:var(--muted)} .live.off i{background:var(--muted);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,132,.55)}70%{box-shadow:0 0 0 8px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
#sync.ok{color:var(--ok)} #sync.warn{color:var(--warn)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 24px;align-items:end;padding:16px;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:6px}
@media (max-width:640px){.hero{grid-template-columns:1fr}}
h1{margin:0;font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted);font-size:12.5px}
.nums{display:flex;flex-wrap:wrap;gap:20px;margin-top:12px;font-family:var(--mono)}
.nums div{display:grid}
.nums b{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.nums span{font-size:11px;color:var(--muted)}
.meter{display:grid;gap:6px;min-width:250px}
.meter .cap{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.meter .cap b{color:var(--warn)}
.lv{display:grid;gap:4px}
.lv span{height:30px;border:1px solid var(--line);border-radius:3px;display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--muted);background:var(--panel)}
.lv .done{background:var(--ok);color:#07090b;border-color:transparent}
.lv .cur{background:var(--warn);color:#07090b;border-color:transparent;outline:2px solid var(--warn);outline-offset:2px}
.meter .key{font-family:var(--mono);font-size:10.5px;color:var(--muted);display:grid;gap:4px;text-align:center}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px;align-items:start}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.panel{border:1px solid var(--line);background:var(--panel);border-radius:6px;overflow:hidden}
.ph{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.ph b{color:var(--fg);font-weight:700}
.pb{padding:8px 12px}
.empty{font-family:var(--mono);font-size:11.5px;color:var(--muted);padding:6px 0}
ol.log{list-style:none;margin:0;padding:0;font-family:var(--mono);font-size:12px}
ol.log li{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
ol.log li:last-child{border-bottom:0}
.tag{font-weight:700}
.tag.ok{color:var(--ok)} .tag.run{color:var(--warn)} .tag.wait{color:var(--muted)} .tag.fail{color:var(--hot)}
ol.log .t{color:var(--fg);display:block} ol.log .n{color:var(--muted);font-size:11px;display:block}
.b{padding:8px 0;border-bottom:1px dashed var(--line);display:grid;gap:5px}
.b:last-child{border-bottom:0}
.bh{display:flex;justify-content:space-between;font-weight:600}
.bh span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.row{display:grid;grid-template-columns:58px 1fr;gap:8px;align-items:center}
.lbl{font-family:var(--mono);font-size:11px;color:var(--muted)}
.cells{display:flex;flex-wrap:wrap;gap:3px}
.c{font-family:var(--mono);font-size:10.5px;line-height:1.2;padding:3px 5px;border-radius:2px;background:var(--panel2);color:var(--muted);border:1px solid var(--line);cursor:pointer}
.c.d{color:var(--ok);border-color:rgba(61,220,132,.35);background:rgba(61,220,132,.08)}
.c.r{color:var(--warn);border-color:rgba(245,184,61,.45);background:rgba(245,184,61,.1)}
.c.x{color:var(--hot);border-color:rgba(255,77,77,.5);background:rgba(255,77,77,.08)}
.c.f{box-shadow:inset 0 -2px 0 var(--hot)}
.c:focus-visible,.c.sel{outline:1.5px solid var(--info);outline-offset:1px}
.detail{margin:8px 0 0;padding:6px 8px;border-radius:3px;background:var(--panel2);font-family:var(--mono);font-size:11px;min-height:1.4em}
.legend{display:flex;flex-wrap:wrap;gap:12px;padding-top:8px;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;margin-right:5px;border-radius:1px;background:var(--panel2);border:1px solid var(--line)}
.legend .ld::before{background:var(--ok);border-color:var(--ok)} .legend .lr::before{background:var(--warn);border-color:var(--warn)} .legend .lx::before{background:transparent;border-color:var(--hot)} .legend .lf::before{background:var(--hot);border-color:var(--hot)}
ul.fix{list-style:none;margin:0;padding:0;display:grid;gap:4px}
ul.fix li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:6px 8px;border-radius:3px;border-left:2px solid var(--hot);background:rgba(255,77,77,.06)}
ul.fix label{display:grid;grid-template-columns:86px 1fr;gap:8px;cursor:pointer}
ul.fix b{font-family:var(--mono);font-size:11.5px;color:var(--hot);font-weight:700}
ul.fix input{margin:2px 0 0;width:14px;height:14px;accent-color:var(--ok);cursor:pointer}
ul.fix input:focus-visible{outline:2px solid var(--info);outline-offset:2px}
ul.fix li.done{border-left-color:var(--ok);background:rgba(61,220,132,.06)}
ul.fix li.done b{color:var(--ok)} ul.fix li.done span{text-decoration:line-through;color:var(--muted)}
.fixnote{margin:8px 0 0;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.qs{border:1px solid rgba(245,184,61,.5);background:rgba(245,184,61,.05)}
.qs .ph b{color:var(--warn)}
.q{display:grid;gap:6px;padding:10px 0;border-bottom:1px dashed var(--line)}
.q:last-child{border-bottom:0}
.q .qt{font-weight:600;font-size:13.5px}
.q .qw{font-size:12px;color:var(--muted)}
.q .qb{font-family:var(--mono);font-size:10.5px;color:var(--warn)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{font:inherit;font-size:12.5px;padding:5px 10px;border-radius:4px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);cursor:pointer;text-align:left}
.opt:hover{border-color:var(--warn)}
.opt.sel{border-color:var(--ok);background:rgba(61,220,132,.12);color:var(--ok)}
.opt:focus-visible,.qa textarea:focus-visible,.qa button:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.qa{display:grid;grid-template-columns:1fr auto;gap:6px}
.qa textarea{font:inherit;font-size:12.5px;min-height:34px;resize:vertical;padding:6px 8px;border-radius:4px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.qa button{font:inherit;font-size:12px;font-weight:600;padding:0 12px;border-radius:4px;border:1px solid var(--warn);background:transparent;color:var(--warn);cursor:pointer}
.q.ans .qt::after{content:"  answered";font-family:var(--mono);font-size:10.5px;color:var(--ok);font-weight:400}
.q .qs2{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
#qbadge{color:var(--warn);font-weight:700}
.foot{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-align:right}
</style>

<div class="wrap">
  <div class="bar">
    <div class="l"><span class="live off" id="live"><i></i><span id="livetxt">CONNECTING</span></span><span id="runid"></span><span id="model"></span></div>
    <span><span id="qbadge"></span> <span id="sync"></span></span>
  </div>
  <section class="hero">
    <div>
      <h1 id="title">__TITLE__</h1>
      <p class="sub" id="sub">Waiting for the first status update from the run.</p>
      <div class="nums" id="totals"></div>
    </div>
    <div class="meter" id="meter" hidden>
      <div class="cap"><span>RUN READINESS</span><b id="lvcap"></b></div>
      <div class="lv" id="lv"></div>
      <div class="key" id="lvkey"></div>
    </div>
  </section>
  <section class="panel qs" id="qpanel" hidden>
    <div class="ph"><b>QUESTIONS FOR YOU</b><span id="qcount"></span></div>
    <div class="pb" id="qlist"></div>
  </section>
  <div class="grid">
    <section class="panel">
      <div class="ph"><b>ACTIVITY</b><span id="stepcount"></span></div>
      <div class="pb"><ol class="log" id="log"><li class="empty">No steps yet.</li></ol></div>
    </section>
    <div style="display:grid;gap:12px">
      <section class="panel" id="sheetpanel">
        <div class="ph"><b id="itemsname">SHEETS</b><span id="sheetcount"></span></div>
        <div class="pb">
          <div id="groups"><p class="empty">No sheets yet.</p></div>
          <p class="detail" id="detail">Click a sheet to see what is on it.</p>
          <div class="legend"><span class="ld">done</span><span class="lr">in progress</span><span>queued</span><span class="lx">failed</span><span class="lf">hand fix</span></div>
        </div>
      </section>
      <section class="panel">
        <div class="ph"><b>HAND FIXES</b><span id="fixcount"></span></div>
        <div class="pb"><ul class="fix" id="fixes"><li class="empty" style="border:0;background:none">None so far.</li></ul><p class="fixnote" id="fixnote"></p></div>
      </section>
    </div>
  </div>
  <p class="foot" id="stamp"></p>
</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var db=null, fixCol=null, ticks={}, info={}, updated=null;
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
  function ago(){if(!updated)return;var m=Math.round((Date.now()-new Date(updated).getTime())/60000);
    $("stamp").textContent="UPDATED "+(m<1?"JUST NOW":m<60?m+" MIN AGO":m<1440?Math.round(m/60)+" H AGO":new Date(updated).toLocaleDateString());}
  setInterval(ago,30000);
  function selectChip(b){[].slice.call(document.querySelectorAll(".c.sel")).forEach(function(c){c.classList.remove("sel");});b.classList.add("sel");
    var x=info[b.dataset.id]||{};var st={d:"done",r:"in progress",x:"failed"}[x.s]||"queued";
    $("detail").textContent=b.dataset.id+" · "+st+(x.note?" · "+x.note:"")+(b.classList.contains("f")?" · needs a hand fix":b.dataset.fixed?" · hand fix done":"");}
  var fixList=[];
  function chipFlags(){var open={},closed={};fixList.forEach(function(f){(f.sheets||[]).forEach(function(id){if(ticks[f.id])closed[id]=1;else open[id]=1;});});
    [].slice.call(document.querySelectorAll(".c[data-id]")).forEach(function(c){var it=info[c.dataset.id]||{};var need=open[c.dataset.id]||(it.f&&!closed[c.dataset.id]);c.classList.toggle("f",!!need);c.dataset.fixed=closed[c.dataset.id]&&!need?"1":"";});}
  function paintFixes(){var n=0,t=0;[].slice.call(document.querySelectorAll("#fixes input")).forEach(function(b){t++;b.checked=!!ticks[b.dataset.id];b.closest("li").classList.toggle("done",b.checked);if(b.checked)n++;});
    $("fixcount").textContent=t?n+" of "+t+" done":"";chipFlags();}
  function render(v){
    updated=v.updated||updated;ago();
    if(v.title){$("title").textContent=v.title;document.title=v.title;}
    $("sub").textContent=v.sub||"";
    $("runid").textContent=v.run?"RUN "+v.run:""; $("model").textContent=v.model||"";
    var s=$("sync");s.textContent=v.sync?"● "+v.sync:"";s.className=v.syncOk?"ok":"warn";
    var tt=$("totals");tt.textContent="";(v.totals||[]).forEach(function(x){var d=el("div");d.appendChild(el("b",null,x.v));d.appendChild(el("span",null,x.l));tt.appendChild(d);});
    var L=v.level;$("meter").hidden=!L;
    if(L){var labels=L.labels||[];var n=labels.length||5;$("lvcap").textContent=L.text||"";
      var lv=$("lv"),k=$("lvkey");lv.textContent="";k.textContent="";lv.style.gridTemplateColumns=k.style.gridTemplateColumns="repeat("+n+",1fr)";
      for(var i=1;i<=n;i++){var sp=el("span",i<L.n||(i===L.n&&L.done)?"done":i===L.n?"cur":"",String(i));lv.appendChild(sp);k.appendChild(el("span",null,labels[i-1]||""));}}
    var log=$("log");log.textContent="";var steps=v.steps||[],ok=0;
    steps.forEach(function(x){if(x.s==="ok")ok++;var li=el("li");li.appendChild(el("span","tag "+(x.s||"wait"),{ok:"[OK]",run:"[RUN]",fail:"[ERR]"}[x.s]||"[--]"));
      var w=el("span");w.appendChild(el("span","t",x.t));if(x.n)w.appendChild(el("span","n",x.n));li.appendChild(w);log.appendChild(li);});
    if(!steps.length)log.appendChild(el("li","empty","No steps yet."));
    $("stepcount").textContent=steps.length?ok+" of "+steps.length+" done":"";
    if(v.itemsName)$("itemsname").textContent=v.itemsName.toUpperCase();
    var g=$("groups");g.textContent="";info={};var tot=0,dn=0;
    (v.groups||[]).forEach(function(gr){var b=el("div","b");var h=el("div","bh",gr.name);var gt=0,gd=0;
      (gr.rows||[]).forEach(function(r){(r.items||[]).forEach(function(it){gt++;if(it.s==="d")gd++;});});
      h.appendChild(el("span",null,gd+"/"+gt));b.appendChild(h);tot+=gt;dn+=gd;
      (gr.rows||[]).forEach(function(r){var row=el("div","row");row.appendChild(el("span","lbl",r.label||""));var cells=el("div","cells");
        (r.items||[]).forEach(function(it){info[it.id]=it;var c=el("button","c"+(it.s&&it.s!=="p"?" "+it.s:"")+(it.f?" f":""),it.short||it.id);
          c.type="button";c.dataset.id=it.id;if(it.note)c.title=it.note;c.addEventListener("click",function(){selectChip(c);});cells.appendChild(c);});
        row.appendChild(cells);b.appendChild(row);});
      g.appendChild(b);});
    if(!(v.groups||[]).length)g.appendChild(el("p","empty","No sheets yet."));
    $("sheetcount").textContent=tot?dn+" of "+tot+" done":"";
    fixList=v.fixes||[];var ul=$("fixes");ul.textContent="";(v.fixes||[]).forEach(function(f){var li=el("li");li.dataset.id=f.id;var cb=el("input");cb.type="checkbox";cb.id="fix-"+f.id;cb.dataset.id=f.id;
      var lab=el("label");lab.htmlFor=cb.id;lab.appendChild(el("b",null,f.where));lab.appendChild(el("span",null,f.what));li.appendChild(cb);li.appendChild(lab);ul.appendChild(li);
      cb.addEventListener("change",function(){ticks[f.id]=cb.checked;paintFixes();if(!fixCol){$("fixnote").textContent="Ticks can't be saved in this view.";return;}
        fixCol.doc(f.id).set({done:cb.checked,at:new Date().toISOString()}).then(function(){$("fixnote").textContent="Saved.";},function(e){$("fixnote").textContent="That tick was not saved ("+((e&&e.code)||"error")+"). Tick it again.";});});});
    if(!(v.fixes||[]).length){var e=el("li","empty","None so far.");e.style.border="0";e.style.background="none";ul.appendChild(e);}
    paintFixes();
    renderQs(v);
  }

  var answers={}, qCol=null, qList=[];
  function paintQs(){var open=0;qList.forEach(function(q){var a=answers[q.id];var box=document.querySelector('.q[data-id="'+q.id+'"]');if(!box)return;
      box.classList.toggle("ans",!!a);if(!a)open++;
      [].slice.call(box.querySelectorAll(".opt")).forEach(function(o){o.classList.toggle("sel",!!a&&a.choice===o.dataset.v);});
      var st=box.querySelector(".qs2");st.textContent=a?("Your answer: "+(a.choice||"")+(a.choice&&a.text?" · ":"")+(a.text||"")+". Claude picks it up at the next step."):"";});
    $("qcount").textContent=qList.length?open+" open of "+qList.length:"";$("qbadge").textContent=open?open+" QUESTION"+(open>1?"S":"")+" WAITING ·":"";}
  function sendAnswer(q,choice,text,box){var prev=answers[q.id]||{};var a={choice:choice!=null?choice:(prev.choice||""),text:text!=null?text:(prev.text||""),at:new Date().toISOString()};
    answers[q.id]=a;paintQs();if(!qCol){box.querySelector(".qs2").textContent="Answers can't be saved in this view.";return;}
    qCol.doc(q.id).set(a).catch(function(e){box.querySelector(".qs2").textContent="Not saved ("+((e&&e.code)||"error")+"). Try again.";});}
  function renderQs(v){qList=v.questions||[];var L=$("qlist");L.textContent="";$("qpanel").hidden=!qList.length;
    qList.forEach(function(q){var box=el("div","q");box.dataset.id=q.id;box.appendChild(el("div","qt",q.q));if(q.why)box.appendChild(el("div","qw",q.why));if(q.blocks)box.appendChild(el("div","qb","BLOCKS: "+q.blocks));
      if((q.options||[]).length){var os=el("div","opts");q.options.forEach(function(o){var b=el("button","opt",o);b.type="button";b.dataset.v=o;b.addEventListener("click",function(){sendAnswer(q,o,null,box);});os.appendChild(b);});box.appendChild(os);}
      var qa=el("div","qa");var ta=el("textarea");ta.id="qa-"+q.id;ta.placeholder=(q.options||[]).length?"Add a note or a different answer (optional)":"Type your answer";ta.setAttribute("aria-label","Answer to: "+q.q);
      var a=answers[q.id];if(a&&a.text)ta.value=a.text;var sb=el("button",null,"Send");sb.type="button";sb.addEventListener("click",function(){sendAnswer(q,null,ta.value.trim(),box);});
      qa.appendChild(ta);qa.appendChild(sb);box.appendChild(qa);box.appendChild(el("div","qs2",""));L.appendChild(box);});
    paintQs();}
  function live(on,txt){$("live").classList.toggle("off",!on);$("livetxt").textContent=txt;}
  var tries=0;(function wait(){
    if(window.claude&&window.claude.use){window.claude.use("db").then(function(d){
      if(!d){live(false,"OFFLINE");$("sub").textContent="Open this page on claude.ai while signed in to see the run status.";return;}
      db=d;fixCol=db.collection("fixes");qCol=db.collection("answers");
      qCol.onSnapshot(function(q){answers={};q.docs.forEach(function(x){var v=x.data();if(v)answers[x.id]=v;});paintQs();},function(){});
      var timer=setTimeout(function(){live(false,"NO DATA");},10000);
      db.doc("status/now").onSnapshot(function(snap){clearTimeout(timer);live(true,"LIVE");if(snap.exists){var v=snap.data();if(v)render(v);}},function(){clearTimeout(timer);live(false,"ERROR");});
      fixCol.onSnapshot(function(q){ticks={};q.docs.forEach(function(x){var v=x.data();if(v)ticks[x.id]=!!v.done;});paintFixes();},function(){$("fixnote").textContent="Saved ticks can't be loaded.";});
    },function(){live(false,"OFFLINE");});return;}
    if(++tries<50){setTimeout(wait,200);return;}
    live(false,"OFFLINE");$("sub").textContent="Open this page on claude.ai while signed in to see the run status.";
  })();
})();
</script>
